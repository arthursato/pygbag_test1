<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title> Mijn Eerste Game</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;      
    }
    canvas {
      border: 2px solid #fff;
      background: #000
    }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="640" height="480"></canvas>
<script>
  const canvas = doucment.getElemntById("gameCanvas");
  const ctx = canvas.getContext("2d");
  let score = 0
  function update() {
    score++;
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ffffff";
    ctx.font = "32px Arial";
    ctx.fillText("Score / Frames: " + score, 50, 80);
  }
  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop)
  }
  gameLoop();
</script>
</body>
</html>
